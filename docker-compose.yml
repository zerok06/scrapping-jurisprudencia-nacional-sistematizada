services:
  dashboard:
    build: .
    container_name: jurisprudencia_dashboard
    command: streamlit run src/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  scraper:
    build: .
    container_name: jurisprudencia_scraper
    command: python src/main.py --interval 12
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
